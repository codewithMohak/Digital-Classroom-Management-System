<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Class</title>
    <link rel="stylesheet" href="join.css">
</head>
<body>

    <div class="modal">
        <div class="modal-content">
            <h2>Join class</h2>

            <div class="class-code-box">
                <p><strong>Class code</strong></p>
                <p class="subtext">To join, get the class code from your teacher and enter it here.</p>
                <input type="text" placeholder="Class code">
            </div>

            <div class="instructions">
                <p>To sign in with a class code</p>
                <ul>
                    <li>Use an authorized account</li>
                    <li>Use a class code with 5-7 letters or numbers, and no spaces or symbols</li>
                </ul>
            </div>

            <div class="modal-footer">
                <button class="cancel-btn">Cancel</button>
                <button class="join-btn">Join</button>
            </div>
        </div>
    </div>

</body>
</html>
