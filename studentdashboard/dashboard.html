<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Archita Behera</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="navbar-left">
        <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
        <div class="logo" id="logo">📖 EduBoard</div>
    </div>
    <h1>Welcome! Archita Behera</h1>
    <button class="logout-btn">Log Out</button>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <ul>
        <li>a</li>
        <li><a href="#">🏠 Dashboard</a></li>
        <li><a href="#">📚 My Classes</a></li>
        <li><a href="#">📝 Assignments</a></li>
        <li><a href="#">📊 Grades & Performance</a></li>
        <li><a href="#">📢 Announcements</a></li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content" id="main-content">
    <main>
        <section class="greeting">
            <h1>Hello Archita!</h1>
            <p>We're glad to have you here. Get ready to explore and make the most of your learning journey!</p>
        </section>

        <!-- Dashboard Section -->
        <section class="dashboard">
            <div class="card-container">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </div>
        </section>
    </main>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');

        sidebar.classList.toggle('open');
        mainContent.classList.toggle('shift');
    }
</script>

</body>
</html>
