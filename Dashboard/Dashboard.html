<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduBridge Dashboard</title>
    <link rel="stylesheet" href="Dashboard.css">
</head>
<body>

    <!-- Toggle Button for Sidebar -->
    <button id="openSidebar" class="toggle-btn">☰</button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button id="closeSidebar" class="close-btn">✖</button>
        <div class="logo">
            <img src="logo.png" alt="Logo"> <!-- Replace with your logo -->
        </div>
        <ul class="menu">
            <li class="active"><i class="icon">🏠</i> Dashboard</li>
            <li><i class="icon">📚</i> Classrooms</li>
            <li><i class="icon">📄</i> Assignments</li>
            <li><i class="icon">📊</i> Attendance</li>
            <li><i class="icon">📈</i> Students Progress</li>
            <li><i class="icon">💬</i> Messages</li>
            <li><i class="icon">🖥️</i> Whiteboard</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <div class="profile-icon">A</div>
            <span class="welcome-text">Welcome, Neha Kunte!</span>
            <button class="logout-button">Log out</button>
        </div>

        <div class="dashboard">
            <div class="greeting-card">
                <h1>Hello Neha Kunte!</h1>
                <p>We're glad to have you here. Get ready to explore and make the most of your learning journey!</p>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <h3>Task Updates</h3>
                    
                </div>
                <div class="stat-card">
                    <h3>New Messages</h3>
                    
                </div>
                <div class="stat-card">
                    <h3>Attendance</h3>
                    
                </div>
            </div>

            <div class="additional-content">
                <div class="placeholder-box">
                    
                    
                </div>
                <div class="placeholder-box">
                    
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const openSidebar = document.getElementById('openSidebar');
            const closeSidebar = document.getElementById('closeSidebar');
           

            openSidebar.addEventListener('click', () => {
                sidebar.classList.add('open');
                openSidebar.style.display = 'none';

            });

            closeSidebar.addEventListener('click', () => {
                sidebar.classList.remove('open');
                openSidebar.style.display = 'block';
            });
        });
    </script>
</body>
</html>
