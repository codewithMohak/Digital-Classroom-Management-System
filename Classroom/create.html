<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Class</title>
    <link rel="stylesheet" href="create.css">
</head>
<body>

    <div class="modal">
        <div class="modal-content">
            <h2>Create a class</h2>
            <input type="text" class="input-field" placeholder="Enter Class name">
            <input type="text" class="input-field" placeholder="Enter section">
            <input type="text" class="input-field" placeholder="Enter Subject name">
            <div class="modal-actions">
                <button class="cancel-btn">Cancel</button>
                <button class="create-btn">Create</button>
            </div>
        </div>
    </div>

</body>
</html>
